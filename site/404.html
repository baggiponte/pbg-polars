<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slides have moved</title>
  <link rel="canonical" href="https://talks.baggiponte.com/pbg-polars/">
  <script>
    const base = "/pbg-polars";
    const path = location.pathname;
    let suffix = path === base ? "" : path.slice((base + "/").length);
    if (suffix === "index.html" || suffix === "404.html") suffix = "";
    if (path === base || path.startsWith(base + "/")) {
      const target = new URL("https://talks.baggiponte.com/pbg-polars/");
      target.pathname += suffix;
      target.search = location.search;
      target.hash = location.hash;
      location.replace(target.href);
    }
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=https://talks.baggiponte.com/pbg-polars/"></noscript>
</head>
<body><p>These slides have moved to <a href="https://talks.baggiponte.com/pbg-polars/">https://talks.baggiponte.com/pbg-polars/</a>.</p></body>
</html>
